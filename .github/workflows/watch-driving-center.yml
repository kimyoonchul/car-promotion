name: watch-driving-center

# GitHub 의 짧은 주기 cron 은 실제로는 2~4시간씩 밀린다 (2026-09 관측: */10 이 하루 10회 실행).
# 그래서 6시간마다 잡을 하나 띄우고, 잡 안에서 --loop 로 5분마다 조회한다 (잡 한도 6시간, 공개 레포는 시간 무제한).
# 시동 cron 이 밀려도 앞 잡이 5시간 45분 동안 돌고 있어 빈 구간이 짧다.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# 앞 잡이 아직 돌고 있으면 새 잡은 기다린다 (겹쳐서 조회·커밋하지 않도록)
concurrency:
  group: watch-driving-center
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Git identity (상태 파일을 루프 안에서 바로 커밋하기 위해)
        run: |
          git config user.name "campaign-bot"
          git config user.email "campaign-bot@users.noreply.github.com"

      - run: node src/watch-driving-center.js --loop
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_STATE: '1'
          LOOP_MINUTES: '345'
          POLL_MINUTES: '5'

      # 루프 안 커밋이 실패했을 때의 뒷정리
      - name: Commit state (fallback)
        if: always()
        run: |
          git add data/driving-center.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update driving center seat state"
            git pull --rebase origin main
            git push
          fi
